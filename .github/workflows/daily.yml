name: Daily AI news digest

on:
  schedule:
    # GitHub cron is always UTC: 02:30 UTC = 08:00 IST. Runs can start late under load.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest instead of emailing it"
        type: boolean
        default: false

# Never run two digests at once
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Apply database migrations
        run: uv run --frozen --no-dev python -m app.main migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run the pipeline
        run: uv run --frozen --no-dev python -m app.main run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}