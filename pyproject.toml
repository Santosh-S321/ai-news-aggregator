[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Daily AI news digest: scrape, dedupe, summarize, rank, email."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "openai>=1.60",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "tenacity>=8.5",
    "trafilatura>=1.12",
    "youtube-transcript-api>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
